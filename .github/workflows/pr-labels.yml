name: PR label commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  label-commands:
    uses: nirarg/migration-planner-workflows/.github/workflows/pr-label-commands.yml@main
    with:
      allowed-labels: '["ready-for-review","hold","work-in-progress"]'
